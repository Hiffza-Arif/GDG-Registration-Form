<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="style.css">
 <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
</head>
<body>
    <div class="form-container">
        <h1>Event Registration</h1>
        <p class="subtitle">Please fill in the form below to register for the event.</p>
        <form>
            <fieldset>
                <legend>Personal Information</legend>
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" placeholder="Enter your full name" required>

                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" placeholder="Enter your email address" required>

                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>

                <label for="password">Password:</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>

                <label for="date">Date of Birth:</label>
                <input type="date" id="date" name="date" required>
            </fieldset>

            <fieldset>
                <legend>Event Details</legend>
                <Label>Gender</Label>
                <div class="gender-options">
                    <input type="radio" id="male" name="gender" value="male" required>
                    <label for="male">Male</label>

                    <input type="radio" id="female" name="gender" value="female">
                    <label for="female">Female</label>
</div>
                <label> Choose Your Interset</label>
                <div class="Option">
                    <label>
                         <label>
                        <input type="checkbox" name="interest" value="Web Development">
                        Web Development
                    </label>

                    <label>
                        <input type="checkbox" name="interest" value="App Development">
                        App Development
                    </label>

                    <label>
                        <input type="checkbox" name="interest" value="AI">
                        Artificial Intelligence
                    </label>
                
                </div>
                 <label for="event">Select Event</label>

                <select id="event" required>
                    <option value="">Choose an event</option>
                    <option>Web Development Workshop</option>
                    <option>AI Workshop</option>
                    <option>Tech Seminar</option>
                    <option>Programming Competition</option>
                </select>

                <label for="message">Why do you want to join?</label>

                <textarea id="message" rows="4"
                placeholder="Write something about yourself..."></textarea>
            </fieldset>
            <div class="buttons">
                <button type="submit">Register</button>
                <button type="reset">Reset</button>
            </div>
        </form>
    </div>
</body>
</html>
